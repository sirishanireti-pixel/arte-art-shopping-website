<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTÉ - Modern Art Gallery</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="logo">
        <a href="/" data-link>ARTÉ</a>
      </div>
      <nav class="nav-links">
        <a href="/" data-link>Gallery</a>
        <a href="/cart" data-link>Cart (<span id="cart-count">0</span>)</a>
        <a href="/profile" data-link id="nav-profile" style="display: none;">Profile</a>
        <a href="/admin" data-link id="nav-admin" style="display: none;">Admin</a>
      </nav>
      <div class="auth-buttons">
        <button id="btn-login" class="btn outline">Login</button>
        <div id="user-info" style="display: none; align-items: center; gap: 1rem;">
          <span id="user-email" style="font-size: 0.9rem; color: #aaa;"></span>
          <button id="btn-logout" class="btn">Logout</button>
        </div>
      </div>
    </header>

    <!-- Main Content Area where pages are rendered -->
    <main id="app">
      <!-- Content injected here by router -->
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 id="auth-title">Login</h2>
        <form id="auth-form">
          <input type="email" id="auth-email" placeholder="Email" required />
          <input type="password" id="auth-password" placeholder="Password" required />
          <button type="submit" class="btn block" id="auth-submit">Login</button>
        </form>
        <p class="auth-toggle">
          <span id="auth-toggle-text">Don't have an account? </span>
          <a href="#" id="auth-toggle-btn">Sign up</a>
        </p>
      </div>
    </div>

    <!-- Notification system -->
    <div id="toast-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
